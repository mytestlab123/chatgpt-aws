site_name: ChatGPT AWS Lab
site_description: Verified ChatGPT, AWS Core MCP, GitHub OIDC, Terraform, automation, and CI/CD lab knowledge.
repo_url: https://github.com/mytestlab123/chatgpt-aws
repo_name: mytestlab123/chatgpt-aws
edit_uri: edit/main/docs/
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Start Here:
      - Session Bootstrap: SESSION_BOOTSTRAP.md
      - Portable AWS + MCP Knowledge: PORTABLE_AWS_MCP_KNOWLEDGE.md
  - Labs:
      - Experiments: EXPERIMENTS.md
      - Terraform Drift Demo: DRIFT_DEMO.md
      - Automation + CI/CD Lab: AUTOMATION_CICD_LAB.md

extra:
  generator: false
