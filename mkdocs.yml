site_name: ChatGPT AWS Lab
site_description: Reusable AWS MCP, GitHub OIDC, infrastructure and documentation engineering.
site_url: !ENV [DOCS_SITE_URL, 'https://mytestlab123.github.io/chatgpt-aws/']
repo_url: !ENV [DOCS_REPO_URL, 'https://github.com/mytestlab123/chatgpt-aws']
repo_name: Source repository
edit_uri: edit/main/docs/
use_directory_urls: false
exclude_docs: |
  downloads/PROMPT.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Start Here:
      - One-URL Agent Bootstrap: PROMPT.md
      - Session Bootstrap: SESSION_BOOTSTRAP.md
      - Fast vs Deterministic: CONTROL_PATHS.md
      - Static Hosting Guide: STATIC_SITE_HOSTING_GUIDE.md
  - Labs and Evidence:
      - Experiments: EXPERIMENTS.md
      - Terraform Drift: DRIFT_DEMO.md
      - Automation and CI/CD: AUTOMATION_CICD_LAB.md
      - OIDC and CodeBuild: OIDC_MCP_CODEBUILD_LAB.md
      - Step Functions and SQS: SFN_SQS_OIDC_MCP_LAB.md
      - Cloudflare Access: CLOUDFLARE_PAGES_ACCESS_LAB.md
      - Portable Knowledge: PORTABLE_AWS_MCP_KNOWLEDGE.md
  - Reusable Guides:
      - Overview: learning/index.md
      - Control Paths: learning/control-paths.md
      - GitHub OIDC: learning/github-oidc.md
      - Hosting: learning/static-hosting.md
      - Private to Public Publishing: learning/publishing-model.md
      - Publication Integrity: learning/publication-integrity.md
      - Review-Gated Publishing: learning/review-gated-publishing.md
      - Cloudflare Pages: learning/cloudflare-pages-access.md
  - Operations:
      - Workflow Routing: WORKFLOW_ROUTING.md
      - Hosting Runbook: HOSTING.md
      - Legacy Two-Repo Publisher: PUBLIC_DOCS_PUBLISHING.md

extra:
  generator: false
