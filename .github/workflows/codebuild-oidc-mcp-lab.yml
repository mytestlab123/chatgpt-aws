name: Dedicated OIDC CodeBuild lab

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Start one billable CodeBuild smoke build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chatgpt-aws-codebuild
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_CODEBUILD_ROLE_ARN }}
  AWS_ALLOWED_ACCOUNT_ID: ${{ vars.AWS_ALLOWED_ACCOUNT_ID }}
  AWS_EXECUTION_REPOSITORY: ${{ vars.AWS_EXECUTION_REPOSITORY }}
  AWS_LABS_ENABLED: ${{ vars.AWS_LABS_ENABLED }}
  CODEBUILD_PROJECT: ${{ vars.AWS_CODEBUILD_PROJECT }}

jobs:
  oidc-codebuild-smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == vars.AWS_EXECUTION_REPOSITORY && vars.AWS_LABS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate explicit AWS target
        run: |
          python3 scripts/check_aws_target.py
          test -n "$CODEBUILD_PROJECT"
      - name: Configure dedicated credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ALLOWED_ACCOUNT_ID }}
      - name: Verify assumed identity and project
        run: |
          aws sts get-caller-identity
          aws codebuild batch-get-projects --names "$CODEBUILD_PROJECT" --query 'projects[].name'
      - name: Start dedicated CodeBuild smoke build
        if: inputs.execute
        id: start
        run: |
          BUILD_ID=$(aws codebuild start-build --project-name "$CODEBUILD_PROJECT" --query 'build.id' --output text)
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
      - name: Wait for CodeBuild result
        if: inputs.execute
        env:
          BUILD_ID: ${{ steps.start.outputs.build_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].buildStatus' --output text)
            echo "attempt=$attempt status=$STATUS"
            case "$STATUS" in
              SUCCEEDED) echo 'CodeBuild smoke: PASS' >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              FAILED|FAULT|STOPPED|TIMED_OUT) exit 1 ;;
            esac
            sleep 5
          done
          echo 'Timed out; inspect CodeBuild before retrying. The remote build may still be running.'
          exit 1
