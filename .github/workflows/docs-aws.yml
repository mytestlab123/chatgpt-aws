name: Docs AWS site

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Reconcile retained AWS hosting and deploy docs (otherwise plan only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chatgpt-aws-docs-site
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  AWS_ALLOWED_ACCOUNT_ID: ${{ vars.AWS_ALLOWED_ACCOUNT_ID }}
  AWS_EXECUTION_REPOSITORY: ${{ vars.AWS_EXECUTION_REPOSITORY }}
  AWS_LABS_ENABLED: ${{ vars.AWS_LABS_ENABLED }}
  TF_IN_AUTOMATION: 'true'

jobs:
  build-plan-deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == vars.AWS_EXECUTION_REPOSITORY && vars.AWS_LABS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate explicit AWS target
        run: python3 scripts/check_aws_target.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build documentation
        run: |
          python -m pip install -r requirements-docs.txt
          python scripts/site_tools.py prepare --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          mkdocs build --strict
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ALLOWED_ACCOUNT_ID }}
      - name: Verify identity and Terraform configuration
        run: |
          aws sts get-caller-identity
          terraform -chdir=infra/docs-site init -input=false
          terraform -chdir=infra/docs-site fmt -check
          terraform -chdir=infra/docs-site validate
      - name: Save plan without publishing raw state values
        run: terraform -chdir=infra/docs-site plan -input=false -no-color -out=tfplan > infra/docs-site/plan.txt
      - name: Apply saved plan
        if: inputs.apply
        run: terraform -chdir=infra/docs-site apply -input=false tfplan
      - name: Build for CloudFront and deploy generated site
        if: inputs.apply
        run: |
          SITE_URL=$(terraform -chdir=infra/docs-site output -raw site_url)
          export DOCS_SITE_URL="${SITE_URL}/"
          mkdocs build --strict
          mkdir -p site/downloads
          cp PROMPT.md site/downloads/PROMPT.md
          python scripts/site_tools.py check --base-url "$DOCS_SITE_URL"
          BUCKET=$(terraform -chdir=infra/docs-site output -raw bucket_name)
          aws s3 sync site/ "s3://${BUCKET}/" --delete
          DIST_ID=$(terraform -chdir=infra/docs-site output -raw distribution_id)
          ID=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$ID"
          python scripts/site_tools.py live --base-url "$DOCS_SITE_URL" --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
