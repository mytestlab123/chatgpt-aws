name: Deterministic Step Functions + SQS lab

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sfn-sqs-oidc-mcp-lab.yml"
      - "infra/sfn-sqs/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sfn-sqs-oidc-mcp-lab.yml"
      - "infra/sfn-sqs/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: chatgpt-aws-sfn-sqs-lab
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"
  STATE_MACHINE_ARN: arn:aws:states:ap-southeast-1:063884340510:stateMachine:chatgpt-aws-sfn-sqs-smoke
  QUEUE_URL: https://sqs.ap-southeast-1.amazonaws.com/063884340510/chatgpt-aws-sfn-sqs-smoke

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/sfn-sqs

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure infrastructure credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::063884340510:role/github-actions-chatgpt-aws-lab
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify infrastructure assumed identity
        run: aws sts get-caller-identity

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform format and validate
        run: |
          terraform fmt -check -diff
          terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "Terraform plan failed"
            exit 1
          fi
          terraform show -no-color tfplan > plan.txt
          echo "### Step Functions + SQS Terraform plan" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ]; then
            echo "No changes." >> "$GITHUB_STEP_SUMMARY"
          else
            grep -E '^Plan:|^No changes' plan.txt | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve

      - name: Provider readback after apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws stepfunctions describe-state-machine --state-machine-arn "$STATE_MACHINE_ARN" --query '{name:name,status:status,type:type,roleArn:roleArn}' --output json
          aws sqs get-queue-attributes --queue-url "$QUEUE_URL" --attribute-names QueueArn ApproximateNumberOfMessages --output json

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      - name: Configure dedicated execution credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::063884340510:role/github-actions-chatgpt-aws-sfn-lab
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify dedicated assumed identity
        run: aws sts get-caller-identity

      - name: Start deterministic state-machine execution
        id: start
        shell: bash
        run: |
          name="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          arn=$(aws stepfunctions start-execution \
            --state-machine-arn "$STATE_MACHINE_ARN" \
            --name "$name" \
            --input '{"source":"github-oidc"}' \
            --query executionArn --output text)
          echo "execution_arn=$arn" >> "$GITHUB_OUTPUT"
          echo "Execution: $arn"

      - name: Wait for Step Functions result
        shell: bash
        env:
          EXECUTION_ARN: ${{ steps.start.outputs.execution_arn }}
        run: |
          for i in $(seq 1 30); do
            status=$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query status --output text)
            echo "attempt=$i status=$status"
            case "$status" in
              SUCCEEDED) break ;;
              FAILED|TIMED_OUT|ABORTED) exit 1 ;;
            esac
            sleep 2
          done
          test "$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query status --output text)" = "SUCCEEDED"
          aws stepfunctions get-execution-history --execution-arn "$EXECUTION_ARN" --max-results 20 --query 'events[].type' --output json

      - name: Verify SQS marker and clean up message
        shell: bash
        run: |
          msg=$(aws sqs receive-message \
            --queue-url "$QUEUE_URL" \
            --max-number-of-messages 1 \
            --wait-time-seconds 10 \
            --visibility-timeout 30 \
            --output json)
          count=$(echo "$msg" | jq '.Messages | length // 0')
          test "$count" -eq 1
          body=$(echo "$msg" | jq -r '.Messages[0].Body')
          echo "$body"
          echo "$body" | grep -q 'OIDC-SFN-SQS-PASS'
          receipt=$(echo "$msg" | jq -r '.Messages[0].ReceiptHandle')
          aws sqs delete-message --queue-url "$QUEUE_URL" --receipt-handle "$receipt"
          echo "OIDC-SFN-SQS-PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Final queue readback
        run: |
          aws sqs get-queue-attributes \
            --queue-url "$QUEUE_URL" \
            --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible \
            --output json
