name: Deterministic Step Functions + SQS lab

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply reviewed main and execute the SQS smoke test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chatgpt-aws-sfn-sqs-lab
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ALLOWED_ACCOUNT_ID: ${{ vars.AWS_ALLOWED_ACCOUNT_ID }}
  AWS_EXECUTION_REPOSITORY: ${{ vars.AWS_EXECUTION_REPOSITORY }}
  AWS_LABS_ENABLED: ${{ vars.AWS_LABS_ENABLED }}
  TF_IN_AUTOMATION: 'true'
  STATE_MACHINE_ARN: ${{ vars.AWS_STATE_MACHINE_ARN }}
  QUEUE_URL: ${{ vars.AWS_QUEUE_URL }}

jobs:
  terraform:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == vars.AWS_EXECUTION_REPOSITORY && vars.AWS_LABS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    defaults:
      run:
        working-directory: infra/sfn-sqs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate explicit AWS target
        run: |
          python3 ../../scripts/check_aws_target.py
          test -n "$STATE_MACHINE_ARN"
          test -n "$QUEUE_URL"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
      - name: Configure infrastructure credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ALLOWED_ACCOUNT_ID }}
      - name: Verify identity, initialize and validate
        run: |
          aws sts get-caller-identity
          terraform init -input=false
          terraform fmt -check
          terraform validate
      - name: Save plan without publishing raw state values
        run: terraform plan -input=false -no-color -out=tfplan > plan.txt
      - name: Apply saved plan
        if: inputs.apply
        run: terraform apply -input=false tfplan
      - name: Provider readback
        if: inputs.apply
        run: |
          aws stepfunctions describe-state-machine --state-machine-arn "$STATE_MACHINE_ARN" --query '{name:name,status:status,type:type}'
          aws sqs get-queue-attributes --queue-url "$QUEUE_URL" --attribute-names QueueArn ApproximateNumberOfMessages

  smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == vars.AWS_EXECUTION_REPOSITORY && vars.AWS_LABS_ENABLED == 'true' && inputs.apply
    needs: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_SFN_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate explicit AWS target
        run: python3 scripts/check_aws_target.py
      - name: Configure dedicated execution credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ALLOWED_ACCOUNT_ID }}
      - name: Verify dedicated assumed identity
        run: aws sts get-caller-identity
      - name: Start deterministic execution
        id: start
        run: |
          name="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          arn=$(aws stepfunctions start-execution --state-machine-arn "$STATE_MACHINE_ARN" --name "$name" --input '{"source":"github-oidc"}' --query executionArn --output text)
          echo "execution_arn=$arn" >> "$GITHUB_OUTPUT"
      - name: Wait for result
        env:
          EXECUTION_ARN: ${{ steps.start.outputs.execution_arn }}
        run: |
          for i in $(seq 1 30); do
            status=$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query status --output text)
            case "$status" in
              SUCCEEDED) break ;;
              FAILED|TIMED_OUT|ABORTED) exit 1 ;;
            esac
            sleep 2
          done
          test "$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query status --output text)" = SUCCEEDED
      - name: Verify SQS marker and clean up
        run: |
          set -euo pipefail
          msg=$(aws sqs receive-message --queue-url "$QUEUE_URL" --max-number-of-messages 1 --wait-time-seconds 10 --visibility-timeout 30)
          test "$(echo "$msg" | jq '.Messages | length // 0')" -eq 1
          echo "$msg" | jq -r '.Messages[0].Body' | grep -q 'OIDC-SFN-SQS-PASS'
          receipt=$(echo "$msg" | jq -r '.Messages[0].ReceiptHandle')
          aws sqs delete-message --queue-url "$QUEUE_URL" --receipt-handle "$receipt"
          aws sqs get-queue-attributes --queue-url "$QUEUE_URL" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible
          echo 'OIDC-SFN-SQS-PASS' >> "$GITHUB_STEP_SUMMARY"
