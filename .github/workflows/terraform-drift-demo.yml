name: Terraform drift demo

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed main revision (otherwise plan only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chatgpt-aws-drift-demo
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  AWS_ALLOWED_ACCOUNT_ID: ${{ vars.AWS_ALLOWED_ACCOUNT_ID }}
  AWS_EXECUTION_REPOSITORY: ${{ vars.AWS_EXECUTION_REPOSITORY }}
  AWS_LABS_ENABLED: ${{ vars.AWS_LABS_ENABLED }}
  TF_IN_AUTOMATION: 'true'

jobs:
  terraform:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == vars.AWS_EXECUTION_REPOSITORY && vars.AWS_LABS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/drift-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate explicit AWS target
        run: python3 ../../scripts/check_aws_target.py
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ALLOWED_ACCOUNT_ID }}
      - name: Verify assumed identity
        run: aws sts get-caller-identity
      - name: Terraform init and validate
        run: |
          terraform init -input=false
          terraform fmt -check
          terraform validate
      - name: Save plan without publishing raw state values
        run: terraform plan -input=false -no-color -out=tfplan > plan.txt
      - name: Apply the saved plan
        if: inputs.apply
        run: terraform apply -input=false tfplan
      - name: Provider readback after apply
        if: inputs.apply
        run: aws ssm get-parameter --name /chatgpt-aws/drift-demo --query 'Parameter.{Name:Name,Value:Value,Version:Version}' --output json
