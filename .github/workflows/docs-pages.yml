name: Repository checks and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
  DOCS_REPO_URL: https://github.com/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Unit tests and public workflow boundary checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
          python scripts/validate_public_docs.py
      - name: Build canonical bootstrap and Material site
        run: |
          python scripts/site_tools.py prepare --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          mkdocs build --strict
          mkdir -p site/downloads
          cp PROMPT.md site/downloads/PROMPT.md
          python scripts/site_tools.py check --base-url "$DOCS_SITE_URL"
      - name: Upload Pages artifact from main only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  terraform-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
      - name: Credential-free Terraform validation (not a live plan)
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/*/; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate -no-color
          done

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, terraform-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (source must be GitHub Actions)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify exact live commit and key site outputs
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/site_tools.py live --base-url "$LIVE_URL" --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
