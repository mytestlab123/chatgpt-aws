name: Automation CI/CD lab

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply reviewed main and run the ECR/event smoke scenarios
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chatgpt-aws-automation-cicd
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  AWS_ALLOWED_ACCOUNT_ID: ${{ vars.AWS_ALLOWED_ACCOUNT_ID }}
  AWS_EXECUTION_REPOSITORY: ${{ vars.AWS_EXECUTION_REPOSITORY }}
  AWS_LABS_ENABLED: ${{ vars.AWS_LABS_ENABLED }}
  TF_IN_AUTOMATION: 'true'

jobs:
  terraform-and-smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == vars.AWS_EXECUTION_REPOSITORY && vars.AWS_LABS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/automation-cicd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate explicit AWS target
        run: python3 ../../scripts/check_aws_target.py
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.10.5'
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ALLOWED_ACCOUNT_ID }}
      - name: Verify identity, initialize and validate
        run: |
          aws sts get-caller-identity
          terraform init -input=false
          terraform fmt -check
          terraform validate
      - name: Save plan without publishing raw state values
        run: terraform plan -input=false -no-color -out=tfplan > plan.txt
      - name: Apply saved plan
        if: inputs.apply
        run: terraform apply -input=false tfplan
      - name: Load Terraform outputs
        if: inputs.apply
        run: |
          echo "AUTOMATION_BUCKET=$(terraform output -raw automation_bucket)" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=$(terraform output -raw ecr_repository)" >> "$GITHUB_ENV"
          echo "EVENT_TABLE=$(terraform output -raw event_table)" >> "$GITHUB_ENV"
          echo "LAMBDA_FUNCTION=$(terraform output -raw lambda_function)" >> "$GITHUB_ENV"
          echo "EVENT_RULE=$(terraform output -raw event_rule)" >> "$GITHUB_ENV"
      - name: ECR build push verify delete
        if: inputs.apply
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          TAG="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          test -n "$DIGEST" && test "$DIGEST" != None
          result=$(aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG")
          test "$(echo "$result" | jq '.failures | length')" -eq 0
          test "$(aws ecr list-images --repository-name "$ECR_REPOSITORY" --query "length(imageIds[?imageTag=='${TAG}'])" --output text)" -eq 0
          docker logout "$REGISTRY"
          echo 'ECR artifact lifecycle: PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: S3 and EventBridge automation smoke tests
        if: inputs.apply
        run: |
          set -euo pipefail
          TEST_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          S3_KEY="events/${TEST_ID}.txt"
          S3_ID="s3#${S3_KEY}"
          EB_ID="eventbridge#${TEST_ID}"
          poll_item() {
            local item_id="$1"
            for _ in $(seq 1 30); do
              item=$(aws dynamodb get-item --table-name "$EVENT_TABLE" --key "{\"id\":{\"S\":\"${item_id}\"}}" --consistent-read --query Item.id.S --output text)
              if [ "$item" = "$item_id" ]; then return 0; fi
              sleep 2
            done
            return 1
          }
          printf 's3 automation proof %s\n' "$TEST_ID" > /tmp/chatgpt-aws-s3-proof.txt
          aws s3api put-object --bucket "$AUTOMATION_BUCKET" --key "$S3_KEY" --body /tmp/chatgpt-aws-s3-proof.txt >/dev/null
          poll_item "$S3_ID"
          aws events put-events --entries "[{\"Source\":\"chatgpt.aws.lab\",\"DetailType\":\"automation-test\",\"Detail\":\"{\\\"test_id\\\":\\\"${TEST_ID}\\\",\\\"path\\\":\\\"github-oidc\\\"}\"}]" >/tmp/put-events.json
          test "$(jq -r .FailedEntryCount /tmp/put-events.json)" -eq 0
          poll_item "$EB_ID"
          aws s3api delete-object --bucket "$AUTOMATION_BUCKET" --key "$S3_KEY" >/dev/null
          aws dynamodb delete-item --table-name "$EVENT_TABLE" --key "{\"id\":{\"S\":\"${S3_ID}\"}}" >/dev/null
          aws dynamodb delete-item --table-name "$EVENT_TABLE" --key "{\"id\":{\"S\":\"${EB_ID}\"}}" >/dev/null
          echo 'S3 and EventBridge -> Lambda -> DynamoDB: PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Prove non-MCP delete path
        if: inputs.apply
        run: |
          set -euo pipefail
          KEY="mcp-guard/oidc-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'OIDC delete proof\n' > /tmp/oidc-delete-proof.txt
          aws s3api put-object --bucket "$AUTOMATION_BUCKET" --key "$KEY" --body /tmp/oidc-delete-proof.txt >/dev/null
          aws s3api delete-object --bucket "$AUTOMATION_BUCKET" --key "$KEY" >/dev/null
          COUNT=$(aws s3api list-objects-v2 --bucket "$AUTOMATION_BUCKET" --prefix "$KEY" --query KeyCount --output text)
          test "$COUNT" -eq 0
          echo 'GitHub OIDC S3 delete path: PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Provider readback
        if: inputs.apply
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null
          aws s3api get-public-access-block --bucket "$AUTOMATION_BUCKET" >/dev/null
          aws s3api head-object --bucket "$AUTOMATION_BUCKET" --key mcp-guard/protected.txt >/dev/null
          aws lambda get-function-configuration --function-name "$LAMBDA_FUNCTION" >/dev/null
          aws dynamodb describe-table --table-name "$EVENT_TABLE" >/dev/null
          aws events describe-rule --name "$EVENT_RULE" >/dev/null
          aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/${LAMBDA_FUNCTION}" >/dev/null
          echo 'Provider readback: PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Failure cleanup notice
        if: failure() && inputs.apply
        run: echo 'Live smoke did not finish. Inspect this run-tagged ECR image, S3 object and DynamoDB rows through AWS MCP; do not claim cleanup verified.' >> "$GITHUB_STEP_SUMMARY"
